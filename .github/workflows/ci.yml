name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  docker-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: make up (creates .env from .env.example, builds both images)
        run: make up

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 2
          done
          docker compose logs backend
          exit 1

      - name: Contract smoke test (placeholder keys, so live calls must fail cleanly)
        run: |
          set -e
          curl -fsS http://localhost:8000/health | grep -q '"keys_configured":2'
          # every key fails -> clean JSON 503, never a stack trace
          code=$(curl -s -o out.json -w '%{http_code}' -X POST http://localhost:8000/chat \
            -H 'Content-Type: application/json' -H 'X-Simulate-Failure: *=429' \
            -d '{"session_id":"ci","message":"hi"}')
          cat out.json; echo
          test "$code" = "503"
          grep -q 'all providers unavailable' out.json
          # failed request not stored
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/sessions/ci/messages)" = "404"
          # validation
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/chat \
            -H 'Content-Type: application/json' -d '{"session_id":"ci","message":"  "}')" = "422"

      - name: Frontend is served on :3000 with runtime config
        run: |
          set -e
          curl -fsS http://localhost:3000/ | grep -q '<div id="root">'
          curl -fsS http://localhost:3000/config.js | tee /dev/stderr | grep -q 'http://localhost:8000'

      - name: SQLite lives on the named /data volume and survives a restart
        run: |
          set -e
          docker compose exec -T backend ls -l /data/app.db
          docker compose restart backend
          sleep 5
          docker compose exec -T backend ls -l /data/app.db
          docker volume ls | grep appdata

      - name: Image sizes
        run: docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep -i lyftr || docker images

      - name: make down
        if: always()
        run: make down
